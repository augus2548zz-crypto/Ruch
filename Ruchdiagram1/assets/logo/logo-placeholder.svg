<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96" fill="none">
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE0F7"/>
      <stop offset="55%" stop-color="#FFF3B8"/>
      <stop offset="100%" stop-color="#FFD1EC"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="28" y1="28" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#F472B6" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Cute Pastel Camera Emblem Box -->
  <rect x="6" y="8" width="80" height="80" rx="24" fill="url(#badgeGrad)" stroke="#F9A8D4" stroke-width="2.5" filter="url(#softShadow)"/>

  <!-- Orbit Ring -->
  <ellipse cx="46" cy="50" rx="34" ry="13" transform="rotate(-16 46 50)" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="3 2" fill="none" opacity="0.75"/>

  <!-- Camera Body -->
  <rect x="21" y="31" width="50" height="36" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2.5"/>
  <!-- Camera Top Shutter & Flash -->
  <path d="M31 31V27C31 25.3431 32.3431 24 34 24H42C43.6569 24 45 25.3431 45 27V31" fill="#F472B6" stroke="#1E40AF" stroke-width="2.2"/>
  <rect x="55" y="36" width="9" height="5" rx="2.5" fill="#FDE047" stroke="#1E40AF" stroke-width="1.5"/>

  <!-- Camera Lens -->
  <circle cx="44" cy="49" r="12" fill="url(#lensGrad)" stroke="#1E40AF" stroke-width="2.2"/>
  <circle cx="44" cy="49" r="6" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="40.5" cy="45.5" r="2.5" fill="#FFFFFF"/>

  <!-- 4-Point Sparkles -->
  <path d="M77 18L79.2 23.8L85 26L79.2 28.2L77 34L74.8 28.2L69 26L74.8 23.8L77 18Z" fill="#EC4899"/>
  <path d="M16 64L17.5 68L21.5 69.5L17.5 71L16 75L14.5 71L10.5 69.5L14.5 68L16 64Z" fill="#1D4ED8"/>

  <!-- Brand Text Lockup: Ruchdigicam -->
  <text x="100" y="52" font-family="'Fredoka', 'Prompt', sans-serif" font-size="34" font-weight="700" fill="#1546B8" letter-spacing="-0.5">
    Ruch<tspan fill="#EC4899">digicam</tspan>
  </text>
  <text x="102" y="75" font-family="'Prompt', sans-serif" font-size="13.5" font-weight="600" fill="#85586F" letter-spacing="0.5">
    ✦ ร้านเช่ากล้องดิจิตอล · สมุทรสาคร ✦
  </text>
</svg>
